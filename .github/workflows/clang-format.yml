name: clang- format
on:
  push:

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - uses: DoozyX/clang-format-lint-action@v0.15.0
    - name: run clang-format
      run: clang-format --dry-run -Werror --files=.clang_files
    - name: run git clangformat
      run: git clang-format-15 HEAD~1

